[package]
name = "ssd-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ssd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ssd-core = { path = "../core" }
ssd-api = { path = "../api" }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "process", "signal", "time"] }
thiserror = "1"
tracing = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
ssd-platform-windows = { path = "../platform-windows" }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
