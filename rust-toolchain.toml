# Pinned to an exact version so every machine and the CI build with the same compiler and the same clippy (a new stable must not turn
# the check red by itself). To move it: change the number, run `node tools/check.js`, commit.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# The agent builds for both Windows targets. This line makes sure the MSVC one is there; the host's own comes with the toolchain:
# the CI runner builds with MSVC, and a PC set up with MinGW (`rustup default stable-x86_64-pc-windows-gnu`) builds with GNU.
targets = ["x86_64-pc-windows-msvc"]
