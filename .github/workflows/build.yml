# Verifica o projeto e confere que o instalador (MSI) e o app (APK) compilam.
# Os artefatos gerados aqui NÃO são assinados: servem para conferir o build, não para distribuir (assine localmente: docs/desenvolvimento.md).
# As actions são referenciadas pelo commit (a versão fica no comentário); o Dependabot propõe as atualizações (.github/dependabot.yml).
name: build

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  workflow_call: # a release de uma tag roda este mesmo workflow (.github/workflows/release.yml)

concurrency:
  group: build-${{ github.ref }}
  # um push novo cancela a execução anterior do mesmo PR; na main cada commit termina (a release "latest-build" não fica pela metade)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check (lint, testes, contrato, navegador)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: agent }
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: tools/contract-test
      - name: node tools/check.js --ci
        shell: pwsh
        run: |
          node tools/check.js --ci 2>&1 | Tee-Object -FilePath check.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content check.log -Tail 40 | ForEach-Object { $_ -replace ([char]27 + '\[[0-9;]*m'),'' }) -join '%0A'
            Write-Host "::error title=check falhou::$tail"
          }
          exit $code
      # o check regenera os tipos do contrato (npm run gen:api): se o arquivo versionado mudou, alguém alterou o contrato sem commitar os tipos
      - name: Tipos do contrato em dia
        run: git diff --exit-code -- web/src/api/schema.d.ts

  # Dependências: avisos de segurança (RustSec), licenças e origem dos crates (agent/deny.toml), e o que vai para quem usa no npm.
  # As dependências só de desenvolvimento do npm ficam com o Dependabot: um aviso nelas não chega ao PC de ninguém.
  auditoria:
    name: auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        # the action runs in a container whose rustup would try to install the toolchain of rust-toolchain.toml: it only needs `cargo metadata`
        env: { RUSTUP_TOOLCHAIN: stable }
        with: { manifest-path: agent/Cargo.toml, command: check }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: tools/contract-test

  msi:
    name: MSI (WiX 3.14)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: agent, key: msi }
      - name: Instala o WiX 3.14
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          # o release do WiX não publica hash: este é o do arquivo usado desde o primeiro MSI do projeto (41 297 555 bytes)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') { throw "SHA-256 inesperado do WiX: $hash" }
          Expand-Archive $zip (Join-Path $PWD '.tools\wix')
      - run: npm ci
        working-directory: web
      - name: Gera o MSI
        shell: pwsh
        run: ./agent/scripts/msi/build-msi.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SelfStreamDeck-msi
          path: |
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error

  apk:
    name: APK (Android)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: '17' }
      # a versão do Gradle é a do wrapper (android/gradle/wrapper), conferida por SHA-256; a action valida o gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Testes, lint e o APK de depuração
        working-directory: android
        run: ./gradlew testDebugUnitTest lint assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SelfStreamDeck-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Mantém uma versão de pré-lançamento "latest-build" sempre apontando para o último commit da main que passou na pipeline.
  # Os arquivos NÃO são assinados (o APK é o de depuração): servem para testar, não para distribuir.
  release:
    name: Release latest-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, auditoria, msi, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artefatos }
      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir pub
          cp artefatos/SelfStreamDeck-msi/*.msi pub/SelfStreamDeck.msi
          cp artefatos/SelfStreamDeck-apk/*.apk pub/SelfStreamDeck-debug.apk
          (cd pub && sha256sum SelfStreamDeck.msi SelfStreamDeck-debug.apk > SHA256SUMS.txt)
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build pub/* --prerelease --target "$GITHUB_SHA" \
            --title "Último build da main (${GITHUB_SHA::7})" \
            --notes "Gerado automaticamente pela pipeline a partir do commit ${GITHUB_SHA}. **Sem assinatura**: o MSI faz o Windows mostrar \"editor desconhecido\" e o APK é o de depuração. Serve para testar; para distribuir, assine localmente (docs/desenvolvimento.md)."
