<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <title>Self Stream Deck</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/pages.css">
</head>
<body data-state="connecting">
  <!-- Navigation by orientation (style.css): a rail on the left in landscape, a bar at the bottom in portrait.
       The PC name only shows in the menu; here just the PC icon and a status light. -->
  <nav class="nav" aria-label="Seções">
    <div class="nav-status">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <span id="status" class="status" data-state="connecting">conectando</span>
    </div>
    <div id="tabs" class="tabs" role="tablist" aria-label="Seções"></div>
    <div class="nav-end">
      <button id="menu" class="icon-btn quiet" type="button" aria-label="Configurações" aria-haspopup="true" aria-expanded="false"></button>
    </div>
  </nav>

  <div class="main">
    <!-- Volume (always) and whatever is on right now (power pill, camera, microphone, player, FPS) -->
    <div id="live-strip" class="live-strip">
      <!-- volume: always there (it is used all the time). Opens the volume panel (#volume-panel); icon + short percentage, red and crossed out when muted. -->
      <button id="vol-btn" class="icon-btn quiet vol-btn" type="button" aria-label="Volume" aria-haspopup="dialog" aria-expanded="false"><span class="vol-btn-ico"></span><span id="vol-pct" class="vol-pct">–</span></button>
      <!-- frame rate of a running game, shown on every page but PC > Desempenho; tapping it opens that -->
      <button id="fps" class="fps-float" type="button" aria-label="Abrir Desempenho" hidden><b></b><small>FPS</small></button>
      <!-- shown while a shutdown/restart is scheduled; tapping it opens the Power page -->
      <button id="power-pill" class="pill" type="button" hidden></button>
      <!-- the phone's camera is being sent to the PC as a webcam: tapping it opens the camera sheet -->
      <button id="cam" class="icon-btn quiet" type="button" aria-label="Câmera transmitindo" hidden></button>
      <!-- default microphone: muted = red and crossed out. Only shown when there is a microphone. -->
      <button id="mic" class="icon-btn quiet" type="button" aria-label="Silenciar microfone" hidden></button>
      <!-- whatever is playing: tap = play/pause, hold = open the Media page. Hidden when nothing is playing. -->
      <button id="player" class="icon-btn quiet" type="button" aria-label="Reproduzir ou pausar" hidden></button>
    </div>

    <!-- Offline notice: takes real space (the pager shrinks) and only shows while body[data-state="offline"] -->
    <div id="offline" class="offline" role="alert">
      <span id="offline-text">PC desconectado</span>
      <button id="offline-retry" type="button">Tentar agora</button>
    </div>

    <!-- Swipe sideways between pages. Apps and shortcut pages are generated by app.js to fit the screen;
         the other pages (windows, sound, pc, power) are built once by their own modules (js/*.js). -->
    <main id="pager" class="pager"></main>

    <!-- Where you are inside a section with several pages (pager.js); never takes part in the layout -->
    <div id="page-dots" class="page-dots" aria-hidden="true" hidden></div>
  </div>

  <!-- Taps outside an open panel (volume, menu) land here and only close it, so they never reach the keys underneath. header.js shows/hides it. -->
  <div id="scrim" class="scrim" hidden></div>

  <!-- Settings menu (the gear in the navigation). Outside the nav so it stacks above the scrim: a popover beside the rail in
       landscape, a bottom sheet over the bar in portrait. -->
  <div id="menu-pop" class="menu" role="menu" hidden>
    <div class="grip" aria-hidden="true"><i></i></div>
    <div class="menu-host"><span class="muted">Computador</span><b id="host">PC</b></div>
    <button id="settings" type="button" role="menuitem" hidden>Endereço do PC…</button>
    <button id="refresh" type="button" role="menuitem">Atualizar</button>
  </div>

  <!-- Volume panel: the strip (mute, slider, media keys) lives here, opened by #vol-btn. Popover under the live strip in landscape,
       a short bottom sheet over the bar in portrait. -->
  <div id="volume-panel" class="vol-panel" role="dialog" aria-label="Volume" hidden>
    <div id="volume" class="volume-bar" data-muted="false" data-ready="false">
      <button id="mute" class="icon-btn" type="button" aria-label="Silenciar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          <path class="cross" d="M17 9l5 6M22 9l-5 6"/>
        </svg>
      </button>
      <input id="vol" type="range" min="0" max="100" step="1" value="0" aria-label="Volume">
      <output id="vol-value" for="vol">–</output>
      <div class="media">
        <button class="icon-btn" type="button" data-media="prev" aria-label="Faixa anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5l-9 7 9 7V5z"/></svg>
        </button>
        <button class="icon-btn" type="button" data-media="playpause" aria-label="Reproduzir ou pausar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l8 7-8 7V5zM17 5v14M21 5v14"/></svg>
        </button>
        <button class="icon-btn" type="button" data-media="next" aria-label="Próxima faixa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l9 7-9 7V5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- deck.js first (shared toolkit), then the page modules (they register with Deck.addPage), then the deck modules (keys, pager, header, ...), then app.js, which puts them together and starts -->
  <script src="/deck.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/geometry.js"></script>
  <script src="/js/windows.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/monitor.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/power.js"></script>
  <script src="/js/camera.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/tiles.js"></script>
  <script src="/js/arrange.js"></script>
  <script src="/js/pager.js"></script>
  <script src="/js/pc.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/volume.js"></script>
  <script src="/js/reload.js"></script>
  <script src="/js/connection.js"></script>
  <script src="/app.js"></script>
</body>
</html>
