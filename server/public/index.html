<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <title>Self Stream Deck</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/pages.css">
</head>
<body data-state="connecting">
  <!-- Navigation by orientation (style.css): a rail on the left in landscape, a bar at the bottom in portrait.
       The PC name only shows in the menu; connection trouble shows in the #offline notice. -->
  <nav class="nav" aria-label="Seções">
    <div id="tabs" class="tabs" role="tablist" aria-label="Seções"></div>
    <div class="nav-end">
      <button id="menu" class="icon-btn quiet" type="button" aria-label="Configurações" aria-haspopup="true" aria-expanded="false"></button>
    </div>
  </nav>

  <div class="main">
    <!-- Frame rate of a running game: a small floating counter in the corner (style.css), never in the layout, never takes a touch.
         Shown on every page but PC > Desempenho, only while a game runs. -->
    <div id="fps" class="fps-float" role="status" aria-label="Quadros por segundo" hidden><b></b><small>FPS</small></div>

    <!-- Offline notice: takes real space (the pager shrinks) and only shows while body[data-state="offline"] -->
    <div id="offline" class="offline" role="alert">
      <span id="offline-text">PC desconectado</span>
      <button id="offline-retry" type="button">Tentar agora</button>
    </div>

    <!-- Swipe sideways between pages. Apps and shortcut pages are generated by app.js to fit the screen;
         the other pages (windows, sound, pc, power) are built once by their own modules (js/*.js). -->
    <!-- Edit mode (js/edit.js): in the flow, so the pager shrinks instead of being covered; only shown while body.editing -->
    <div id="edit-bar" class="edit-bar" role="toolbar" aria-label="Modo de edição" hidden>
      <span class="edit-hint">Toque numa tecla para editar · + para criar</span>
      <button id="edit-done" class="edit-done" type="button">Concluir</button>
    </div>

    <main id="pager" class="pager"></main>

    <!-- Where you are inside a section with several pages (pager.js); never takes part in the layout -->
    <div id="page-dots" class="page-dots" aria-hidden="true" hidden></div>
  </div>

  <!-- Taps outside the open menu land here and only close it, so they never reach the keys underneath. header.js shows/hides it. -->
  <div id="scrim" class="scrim" hidden></div>

  <!-- Settings menu (the gear in the navigation). Outside the nav so it stacks above the scrim: a popover beside the rail in
       landscape, a bottom sheet over the bar in portrait. -->
  <div id="menu-pop" class="menu" role="menu" hidden>
    <div class="grip" aria-hidden="true"><i></i></div>
    <div class="menu-host"><span class="muted">Computador</span><b id="host">PC</b></div>
    <button id="settings" type="button" role="menuitem" hidden>Endereço do PC…</button>
    <button id="refresh" type="button" role="menuitem">Atualizar</button>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- deck.js first (shared toolkit), then the page modules (they register with Deck.addPage), then the deck modules (keys, pager, header, ...), then app.js, which puts them together and starts -->
  <script src="/deck.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/geometry.js"></script>
  <script src="/js/windows.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/monitor.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/power.js"></script>
  <script src="/js/idle.js"></script>
  <script src="/js/camera.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/tiles.js"></script>
  <script src="/js/arrange.js"></script>
  <script src="/js/pager.js"></script>
  <script src="/js/edit.js"></script>
  <script src="/js/pc.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/volume.js"></script>
  <script src="/js/reload.js"></script>
  <script src="/js/connection.js"></script>
  <script src="/app.js"></script>
</body>
</html>
